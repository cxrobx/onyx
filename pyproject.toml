[project]
name = "onyx"
version = "0.6.6"
description = "Highlight-to-ask reading companion with subscription-backed Claude and Codex CLI providers."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Christopher Robinson" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "markdown-it-py>=4.0,<5",
    "pypdf>=6.0",
    "uvicorn>=0.27",
]

# `uvicorn[standard]` pulls httptools/uvloop. On Python 3.14 these may need a
# source build; install this extra only if the wheels are available for your
# interpreter, otherwise the bare `uvicorn` dependency above is enough.
[project.optional-dependencies]
fast = ["uvicorn[standard]>=0.27"]
bundle = ["pyinstaller>=6.0"]
# The read-only phone mirror (docs/plans/phone-mirror.md). Imported only inside src/onyx/mirror, only when
# mirror.toml turns it on, so a normal install never needs either.
mirror = ["cryptography>=42", "segno>=1.6"]
test = ["httpx2>=2.0", "reportlab>=4.0"]

[project.scripts]
onyx = "onyx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onyx"]
