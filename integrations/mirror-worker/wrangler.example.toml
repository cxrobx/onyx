# Copy this file to wrangler.toml, which is gitignored, and fill in your own names:
#
#   cp wrangler.example.toml wrangler.toml
#
# Set the phone's read token as a Worker secret (it prompts; nothing goes in this file):
#
#   npx wrangler secret put READ_TOKEN
#
# Keep account ids, bucket names and routes out of anything that is committed.

name = "<your-worker-name>"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# The bucket the Mac publishes into. Its public access (the managed public URL and
# any custom domain) must stay OFF: this Worker is the only way in.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "<your-bucket>"
