name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements-test.lock
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      # The launcher links Sparkle; fetch-sparkle.sh pins its version and sha256.
      - run: |
          SPARKLE="$(./launcher/fetch-sparkle.sh)"
          swiftc -typecheck -F "$SPARKLE" -framework Cocoa -framework WebKit \
            -framework UniformTypeIdentifiers -framework Sparkle launcher/Onyx.swift
      - run: plutil -lint launcher/Info.plist

  browser:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --requirement requirements-browser.lock
      - run: python -m playwright install chromium webkit
      - run: PYTHONPATH=src python -m unittest tests.browser_smoke -v

  # The ⌘E editor. static/onyx-editor.js is its build, committed so the service runs from a checkout with no Node step;
  # a rebuild that differs from it means an edit under editor/ that was never built.
  editor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code ../static/onyx-editor.js

  obsidian:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/obsidian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/obsidian/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test

  # The phone mirror's Worker: the only door onto the bucket, so its refusals are tested here. No dependencies.
  mirror-worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/mirror-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test

  bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      # The app carries the Obsidian plugin, built from integrations/obsidian.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: ./launcher/build-app.sh --no-install
      - run: ./scripts/smoke-bundle.sh
